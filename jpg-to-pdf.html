<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPG to PDF - Free</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    header {
      background: white;
      padding: 20px;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .box {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 30px 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      margin: 25px 0;
    }

    button {
      background: #e5322d;
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #e5322d;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>📸 JPG to PDF</h1>
</header>

<div class="box">

  <h2>JPG to PDF</h2>

  <p>Ek ya multiple JPG images select karein.</p>

  <input
    type="file"
    id="imageFiles"
    accept="image/jpeg,image/png"
    multiple
  >

  <br>

  <button id="convertBtn">
    JPG TO PDF
  </button>

  <div id="status"></div>

  <a class="back" href="index.html">
    ← Back to PDF Tools
  </a>

</div>

<script>

const convertBtn = document.getElementById("convertBtn");
const imageFiles = document.getElementById("imageFiles");
const status = document.getElementById("status");

convertBtn.addEventListener("click", async () => {

  const files = imageFiles.files;

  if (!files.length) {
    status.innerText = "❌ Pehle image select karein.";
    return;
  }

  const formData = new FormData();

  for (const file of files) {
    formData.append("images", file);
  }

  convertBtn.disabled = true;
  status.innerText = "⏳ Images ko PDF me convert kiya ja raha hai...";

  try {

    const response = await fetch(
      "https://pdf-to-word-free-1.onrender.com/jpg-to-pdf",
      {
        method: "POST",
        body: formData
      }
    );

    if (!response.ok) {
      throw new Error("Conversion failed");
    }

    const blob = await response.blob();

    const url = window.URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download = "images-to-pdf.pdf";

    document.body.appendChild(a);
    a.click();
    a.remove();

    window.URL.revokeObjectURL(url);

    status.innerText =
      "✅ PDF successfully create ho gaya!";

  } catch (error) {

    console.error(error);

    status.innerText =
      "❌ JPG to PDF conversion nahi ho paya.";

  }

  convertBtn.disabled = false;

});

</script>

</body>
</html>
